name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PNPM_VERSION: 10.4.1
  HUSKY: 0

jobs:
  lint-typecheck-test:
    name: Lint · Typecheck · Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.18.0, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate wrappers
        run: pnpm --filter neuro-js generate
      - name: Verify generator is deterministic
        run: |
          if [ -n "$(git status --porcelain packages/neuro-js/src/generated)" ]; then
            echo "::error::Generated files differ from committed output. Run \`pnpm generate\` and commit the result."
            git status packages/neuro-js/src/generated
            git diff packages/neuro-js/src/generated | head -200
            exit 1
          fi
      - run: pnpm --filter neuro-js typecheck
      - run: pnpm --filter neuro-js test
      - run: pnpm --filter neuro-js-proxy typecheck
      - run: pnpm --filter neuro-js build

  install-smoke:
    name: Install smoke (npm pack → consume)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: 22.x, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter neuro-js build
      - name: Pack neuro-js
        run: |
          cd packages/neuro-js
          npm pack
          mv neuro-js-*.tgz "$RUNNER_TEMP/neuro-js.tgz"
      - name: Install in a clean dir and run smoke
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP/neuro-js.tgz"
          cp "$GITHUB_WORKSPACE/examples/node-consumer/smoke.mjs" .
          node smoke.mjs

  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with: { node-version: 22.x, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter neuro-js build
      - run: pnpm --filter docs build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/dist
          retention-days: 14
