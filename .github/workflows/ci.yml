name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PNPM_VERSION: 10.33.2
  HUSKY: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck-test:
    name: Lint · Typecheck · Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate wrappers
        run: pnpm --filter neuro-ts generate
      - name: Verify generator is deterministic
        run: |
          if [ -n "$(git status --porcelain packages/neuro-ts/src/generated)" ]; then
            echo "::error::Generated files differ from committed output. Run \`pnpm generate\` and commit the result."
            git status packages/neuro-ts/src/generated
            git diff packages/neuro-ts/src/generated | head -200
            exit 1
          fi
      - run: pnpm --filter neuro-ts typecheck
      - run: pnpm --filter neuro-ts test
      - run: pnpm --filter neuro-ts-proxy typecheck
      - run: pnpm --filter neuro-ts build

  install-smoke:
    name: Install smoke (npm pack -> consume)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter neuro-ts build
      - name: Pack neuro-ts
        run: |
          cd packages/neuro-ts
          npm pack
          mv neuro-ts-*.tgz "$RUNNER_TEMP/neuro-ts.tgz"
      - name: Install in a clean dir and run smoke
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP/neuro-ts.tgz"
          cp "$GITHUB_WORKSPACE/examples/node-consumer/smoke.mjs" .
          node smoke.mjs

  npm-registry-smoke:
    name: npm-registry smoke (${{ matrix.project.name }})
    runs-on: ubuntu-latest
    # Runs against the currently published npm package - independent of the
    # local build. Catches breakage in the registry-distributed artefact.
    # Projects live in smoke/ (not examples/) so pnpm workspace ignores them.
    strategy:
      fail-fast: false
      matrix:
        project:
          - { name: smoke-cjs,    cmd: "node smoke.cjs" }
          - { name: smoke-ts-esm, cmd: "npx tsx@4.21.0 smoke.ts" }
          - { name: smoke-ts-cjs, cmd: "npx tsx@4.21.0 --tsconfig tsconfig.json smoke.ts" }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install neuro-ts from npm registry and run smoke
        run: |
          mkdir -p "$RUNNER_TEMP/${{ matrix.project.name }}"
          cp -r "$GITHUB_WORKSPACE/smoke/${{ matrix.project.name }}/." \
                "$RUNNER_TEMP/${{ matrix.project.name }}/"
          cd "$RUNNER_TEMP/${{ matrix.project.name }}"
          npm install
          ${{ matrix.project.cmd }}

  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter neuro-ts build
      - run: pnpm --filter docs build
      - uses: actions/upload-artifact@v5
        with:
          name: docs-dist
          path: apps/docs/dist
          retention-days: 14
